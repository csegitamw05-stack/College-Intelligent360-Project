services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: campus-intel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_EY5L0ivrKodC@ep-proud-credit-b5uor5m6-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: CORS_ORIGINS
        value: '["*"]'

  # 2. Next.js Frontend Web Service
  - type: web
    name: campus-intel-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "18.18.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://college-intelligent360-project-1.onrender.com/api/v1


