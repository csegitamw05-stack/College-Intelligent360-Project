services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: campus-intel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-intel-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'

  # 2. Next.js Frontend Web Service
  - type: web
    name: campus-intel-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: campus-intel-backend
          property: host
          transform: "https://{value}/api/v1"

# 3. PostgreSQL Database
databases:
  - name: campus-intel-db
    databaseName: campus_intel_db
    user: postgres
    plan: free
    ipAllowList: []
